name: CI-OpenClaw Release PR

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   schedule:
#     - cron: "0 6 * * *"
#   workflow_dispatch:
# <<< ci-local:gated
on:
  workflow_dispatch:

jobs:
  check-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same token, same reason, same failure mode as ci-hub-plugin-resync.yml:
      # a GITHUB_TOKEN-made PR does not trigger CI, and this is the one PR in
      # the repo that changes what the image ships.
      - name: Preflight — require the sync token
        env:
          SYNC_TOKEN: ${{ secrets.CI_HUB_SYNC_TOKEN }}
        run: |
          if [ -z "${SYNC_TOKEN}" ]; then
            echo "::error::CI_HUB_SYNC_TOKEN is not set — needed to push the bump branch and open the PR (this repo Contents: write + Pull requests: write), so the PR triggers CI."
            echo "Set it at Settings → Secrets and variables → Actions. See ci-hub-plugin-resync.yml's header."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get current and latest OpenClaw versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          current_version=$(scripts/openclaw-pin.sh)

          # npm's `latest` dist-tag is what upstream designates as the current
          # stable release. The previous approach — take the last element of
          # `npm view openclaw versions` that contains no hyphen — discarded
          # upstream's same-day patch releases as if they were prereleases.
          # Today that matters: dist-tag latest is 2026.7.1-2, while the filter
          # yielded 2026.7.1, which equalled the pin, so no PR was ever opened.
          latest_version=$(npm view openclaw dist-tags.latest)
          [[ -n "${latest_version}" ]] || { echo "could not resolve openclaw dist-tags.latest"; exit 1; }

          echo "current_version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "latest_version=${latest_version}" >> "$GITHUB_OUTPUT"

          if [[ "${current_version}" == "${latest_version}" ]]; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Dockerfile OpenClaw version
        if: steps.versions.outputs.update_needed == 'true'
        shell: bash
        # Via env, not a ${{ }} interpolation: this value comes from the npm
        # registry, and it is spliced into a sed replacement below.
        env:
          LATEST: ${{ steps.versions.outputs.latest_version }}
        run: |
          set -euo pipefail

          # Constrain what a registry response can put in the Dockerfile.
          [[ "${LATEST}" =~ ^[A-Za-z0-9][A-Za-z0-9.+-]*$ ]] \
            || { echo "::error::refusing to pin an unexpected version string: ${LATEST}"; exit 1; }

          # Match to whitespace, not just digits and dots: against a pin of
          # `2026.7.1-2` a digits-only pattern replaces the `2026.7.1` part and
          # leaves the `-2` behind, producing `openclaw@<new>-2`.
          sed -i -E "s|(npm install -g openclaw@)[^[:space:]]+|\\1${LATEST}|" Dockerfile

          pinned="$(scripts/openclaw-pin.sh)"
          [[ "${pinned}" == "${LATEST}" ]] \
            || { echo "::error::Dockerfile pin is '${pinned}' after the bump, expected '${LATEST}'"; exit 1; }
          echo "Dockerfile now pins: ${pinned}"

      - name: Create or update pull request
        if: steps.versions.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          # Not GITHUB_TOKEN: PRs it opens do not trigger workflows, so the one
          # PR in this repo that changes what the image ships was the only one
          # getting no PR-time CI. Same token ci-hub-plugin-resync.yml uses.
          token: ${{ secrets.CI_HUB_SYNC_TOKEN }}
          branch: bot/ci-openclaw-update-${{ steps.versions.outputs.latest_version }}
          delete-branch: true
          commit-message: "chore: bump openclaw to ${{ steps.versions.outputs.latest_version }}"
          title: "chore: bump openclaw to ${{ steps.versions.outputs.latest_version }}"
          body: |
            Automated update for OpenClaw.

            - Current version: `${{ steps.versions.outputs.current_version }}`
            - Latest npm version: `${{ steps.versions.outputs.latest_version }}`

            Merging this does not publish anything. Cut a release when you want it shipped —
            see `.github/workflows/README-docker-publish.md`:

            ```bash
            git fetch origin --tags
            TAG="$(scripts/next-release-tag.sh)"   # resolve once: it allocates the next free tag
            git tag "$TAG" origin/master
            git push origin "$TAG"
            ```
          labels: |
            ci-openclaw-update

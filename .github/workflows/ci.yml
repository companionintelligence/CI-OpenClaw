name: CI

# Restored 2026-09-10 (was gated to workflow_dispatch/workflow_call-only in the
# August 2026 org-wide cost pass). Found during an org-level CI/CD health audit:
# ordinary PRs against master/main had zero automatic signal — 145 commits and
# 73 merged PRs in 60 days with nothing checking them.
on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    # Advisory nightly run that also validates against openclaw@latest, so an upstream
    # schema tightening surfaces before the version-bump PR lands.
    - cron: "0 5 * * *"
  workflow_dispatch:
  # Called by docker-publish.yml so a red suite cannot ship an image.
  workflow_call:
    inputs:
      ref:
        description: >-
          Ref to test. The publish workflow passes the exact ref it is about to check
          out and build — the release tag — so the gate and the build can never
          disagree about the tree. Leave empty to test the ref that triggered the run.
        type: string
        required: false
        default: ""
    secrets:
      CI_HUB_READ_TOKEN:
        description: >-
          Fine-grained PAT with CI-Hub Contents: read, used by the plugin-integrity job to
          rebuild the vendored bundle from source. Passed explicitly by docker-publish.yml
          (not `secrets: inherit`) so only this one secret crosses into the called workflow.
        required: false

permissions:
  contents: read

env:
  # The Node the jobs that install the openclaw CLI run on.
  #
  # Upstream openclaw dropped Node 22 in 2026.9.3: `engines.node` went from
  # `>=22.22.3 <23 || >=24.15.0 <25 || >=25.9.0` to `>=24.16.0 <25 || >=26.1.0`,
  # and its preinstall script HARD-ERRORS on an unsupported Node rather than
  # warning. On Node 22 the nightly `latest` leg therefore died in `npm install
  # -g` and never reached the schema check at all — the gate was red for an
  # install failure, not for schema drift.
  #
  # Node 24 satisfies both the pinned range and the current one, so a single
  # value covers both matrix channels. Keep it inside the intersection of the
  # pinned and latest `engines.node` when either moves:
  #   npm view "openclaw@$(scripts/openclaw-pin.sh)" engines.node
  #   npm view openclaw@latest engines.node
  OPENCLAW_NODE_VERSION: "24"

concurrency:
  # Keyed on the workflow name as well as the ref. When docker-publish.yml calls this
  # workflow, github.workflow resolves to the CALLER's name, so a publish gate lands in
  # its own group and cannot collide with a CI run on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only supersede in-flight PR runs. A publish gate must never be cancelled out from
  # under the build that depends on it — a cancelled gate must not read as a passed one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit + shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty falls back to checkout's default (the triggering ref). When the publish
          # workflow calls us it passes the exact SHA it is about to build, so we can
          # never test one tree and ship another.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Deliberately NO `npm ci`. The suites are dependency-free by design, and
      # config-reconcile.cjs must never pull node-pty/ws — server.cjs requires those by
      # absolute /app path, which is exactly what made this layer untestable. If this job
      # ever needs an install, that is the signal the module grew a dependency.
      - name: Unit tests (config reconciler + CI memory plugin)
        run: npm run test:unit

      - name: Bootstrap shell tests
        run: npm run test:sh

  schema-gate:
    # The check that generalizes: the config we ACTUALLY write, validated by OpenClaw's
    # OWN strict schema. One unrecognized key invalidates the entire openclaw.json and
    # gets it quarantined at boot, silently reverting everything written in the same pass.
    # The unit suite catches the mistakes we thought to assert; this catches the rest.
    name: openclaw schema gate (${{ matrix.channel }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.channel == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        # The pinned channel blocks PRs. The nightly also probes openclaw@latest, purely
        # as an early warning; it never blocks a PR on a version we have not adopted.
        channel: ${{ github.event_name == 'schedule' && fromJSON('["pinned","latest"]') || fromJSON('["pinned"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty falls back to checkout's default (the triggering ref). When the publish
          # workflow calls us it passes the exact SHA it is about to build, so we can
          # never test one tree and ship another.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          # Not "22": the openclaw CLI installed below refuses to install on it.
          node-version: ${{ env.OPENCLAW_NODE_VERSION }}

      - name: Resolve the openclaw version
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ matrix.channel }}" == "latest" ]]; then
            version="$(npm view openclaw version)"
          else
            # The Dockerfile pin is the single source of truth, so this gate always
            # validates against the same schema the shipped image enforces. It also means
            # the nightly version-bump PR gets schema-gated against the version it
            # proposes, before it can merge. Same one-liner openclaw-release-pr.yml uses.
            if [[ -x scripts/openclaw-pin.sh ]]; then
              version="$(scripts/openclaw-pin.sh)"
            else
              # Compatibility: release tags cut before scripts/openclaw-pin.sh
              # existed can still be rebuilt via workflow_dispatch. This workflow
              # comes from the caller's ref, but the checkout is the old tree.
              # `|| true`: grep exits 1 on no match, pipefail promotes it, and a
              # bare assignment takes that status — so without this the step dies
              # here and the "could not resolve" message below never runs.
              version="$(grep -oE 'openclaw@[0-9][^[:space:]]*' Dockerfile | head -n1 | cut -d'@' -f2 || true)"
            fi
          fi
          [[ -n "${version}" ]] || { echo "could not resolve an openclaw version"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Validating against openclaw@${version}"

      - name: Cache the global openclaw install
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          # Keyed on the version itself, so the cache invalidates exactly when the pin
          # moves and can never go stale. Keyed on the Node major too: openclaw pulls
          # native modules (koffi, tree-sitter-bash), so a tree built under one Node ABI
          # must never be restored under another — which is exactly what the cache shared
          # with plugin-package would do if the two jobs' Node versions ever diverged.
          key: openclaw-${{ runner.os }}-node${{ env.OPENCLAW_NODE_VERSION }}-${{ steps.resolve.outputs.version }}

      - name: Install openclaw@${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [[ "${{ steps.cache.outputs.cache-hit }}" != "true" ]]; then
            npm install -g "openclaw@${{ steps.resolve.outputs.version }}"   # ~88MB
          fi

      - name: Validate the config reconcileConfig() really writes
        env:
          # The gate hard-fails rather than skipping when the binary is missing and CI is
          # set, so this check can never silently pass by not running.
          CI: "true"
          SCHEMA_GATE_OUTDIR: ${{ runner.temp }}/schema-gate
        run: npm run test:schema

      # A real headless turn on that config, started the way QA and other apps start one inside
      # the container: `openclaw agent`, no port/config/model override, against a live gateway and
      # a stub Ollama. Catches the in-container CLI losing its way to the gateway (on 2026-09-17 it
      # dialed the setup proxy and every turn was refused "missing scope: operator.write"), and
      # reports whether upstream's `agent exec` provider bug is still there.
      - name: Run a headless agent turn on the reconciled config
        env:
          CI: "true"
          AGENT_TURN_GATE_OUTDIR: ${{ runner.temp }}/agent-turn-gate
        run: npm run test:agent-turn

      - name: Upload the generated configs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: openclaw-configs-${{ matrix.channel }}
          path: |
            ${{ runner.temp }}/schema-gate/
            ${{ runner.temp }}/agent-turn-gate/*.json
            ${{ runner.temp }}/agent-turn-gate/*.log
            ${{ runner.temp }}/agent-turn-gate/home/.openclaw/openclaw.json
          if-no-files-found: ignore

  plugin-integrity:
    # Vendored ci-hub bundle integrity: rebuild the plugin from the exact CI-Hub commit recorded
    # in openclaw-context/plugins/ci-hub/.ci-hub-source and byte-compare against the committed
    # hub-plugin.mjs. Living in ci.yml means it gates PRs AND releases — docker-publish.yml calls
    # this workflow (passing only CI_HUB_READ_TOKEN, not `secrets: inherit`) before building, so a
    # stale or hand-edited bundle can never ship inside an image. See scripts/check-ci-hub-plugin-drift.sh and
    # companionintelligence/CI-OpenClaw#45.
    #
    # Pinned to the RECORDED source, so it never fails just because CI-Hub `dev` moved on — that
    # "is the bundle behind dev?" freshness question is the separate, advisory
    # ci-hub-plugin-resync.yml workflow.
    #
    # Path-scoped on PRs: the rebuild (and its CI_HUB_READ_TOKEN) only runs when a PR touches the
    # plugin dir or the drift script. An unrelated PR skips the heavy steps and the job passes
    # trivially — so it neither needs the token nor waits on a CI-Hub checkout. Releases, pushes,
    # schedule, and manual dispatch ALWAYS verify. Skipped entirely on fork PRs, which get no token.
    name: ci-hub plugin bundle integrity
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CI-OpenClaw
        uses: actions/checkout@v4
        with:
          # The publish workflow passes the exact SHA it is about to build, so the shipped tree
          # (bundle + .ci-hub-source) is what gets verified — never one tree tested, another shipped.
          ref: ${{ inputs.ref }}
          # Full history so the PR path-scope below can diff against the base commit locally.
          fetch-depth: 0

      - name: Decide whether to rebuild-and-compare
        id: scope
        run: |
          set -euo pipefail
          # Always verify off the PR path (releases / pushes / schedule / dispatch). On a PR, only
          # when the plugin dir or the drift script actually changed — computed with a local git
          # diff (no API call, so no extra GITHUB_TOKEN permissions are needed).
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          # Compute the diff first so a git failure (missing SHA, unmergeable PR) aborts this
          # step under `set -e` and fails CLOSED — red, not a silent skip. Piping git directly
          # into `if … grep` would swallow that failure as "no match" and skip the gate.
          changed="$(git diff --name-only "${base}...${head}")"
          # grep WITHOUT -q so it reads ALL of printf's output. With -q, grep exits on the first
          # match; on a large diff (a matching path early, >64KB of paths after it) printf then dies
          # with SIGPIPE, which pipefail surfaces as a non-zero pipeline — the `if` reads that as
          # "no match" and skips the integrity gate (fail-OPEN). Reading all input keeps it closed.
          if printf '%s\n' "${changed}" \
               | grep -E '^(openclaw-context/plugins/ci-hub/|scripts/check-ci-hub-plugin-drift\.sh$)' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No plugin/bundle/script changes in this PR — skipping the rebuild."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight — require CI_HUB_READ_TOKEN
        if: steps.scope.outputs.run == 'true'
        env:
          TOKEN: ${{ secrets.CI_HUB_READ_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::CI_HUB_READ_TOKEN is not set. This gate rebuilds the plugin from the private CI-Hub repo and needs a fine-grained PAT (CI-Hub Contents: read) at Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Read recorded CI-Hub source SHA
        if: steps.scope.outputs.run == 'true'
        id: stamp
        run: |
          set -euo pipefail
          # grep -m1 (no `| head`) so there is no pipe to SIGPIPE; `|| true` so a stamp with no
          # 40-hex token doesn't abort the assignment under pipefail before the guard below prints
          # an actionable ::error::.
          sha="$(grep -m1 -oE '[0-9a-f]{40}' openclaw-context/plugins/ci-hub/.ci-hub-source || true)"
          [ -n "${sha}" ] || { echo "::error::.ci-hub-source has no commit SHA"; exit 1; }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Recorded CI-Hub source: ${sha}"

      - name: Checkout CI-Hub at the recorded SHA
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: companionintelligence/CI-Hub
          ref: ${{ steps.stamp.outputs.sha }}
          token: ${{ secrets.CI_HUB_READ_TOKEN }}
          # Don't persist the cross-repo PAT into ci-hub/.git/config. This job then runs the PR
          # head's own drift script (attacker-controlled on a same-repo PR), which could otherwise
          # read the token from the git config. The rebuild only reads the working tree + local
          # `git rev-parse HEAD`; it never re-fetches, so the token isn't needed after checkout.
          persist-credentials: false
          path: ci-hub
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.run == 'true'
        with:
          # Match the pnpm CI-Hub itself pins, read from the checked-out repo's packageManager.
          package_json_file: ci-hub/package.json

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "22"

      - name: Install the plugin's build dependency (esbuild)
        if: steps.scope.outputs.run == 'true'
        working-directory: ci-hub
        # Only the openclaw-plugin package (zero runtime deps; esbuild devDep pinned to 0.25.0 by
        # the workspace override). --frozen-lockfile keeps the toolchain deterministic.
        run: pnpm install --frozen-lockfile --filter @ci-hub/openclaw-plugin

      - name: Check for drift
        if: steps.scope.outputs.run == 'true'
        run: ./scripts/check-ci-hub-plugin-drift.sh --check --ci-hub ci-hub

  plugin-package:
    # The memory plugin is published to npm so a stock OpenClaw install can add it the
    # way OpenClaw adds any plugin: `openclaw plugins install npm:<package>`. This job
    # runs that exact path on every PR — pack the plugin, install the tarball into a
    # throwaway HOME with the real CLI, and assert it registers and loads.
    #
    # Verified by hand before this job existed, and the reason it exists: the npm form
    # registers under the MANIFEST id (companionintelligence), not the package name.
    # OpenClaw 2026.9.1+ also claims plugins.slots.memory for kind:memory plugins and
    # requires --accept-capabilities for declared non-default tools. Both are
    # load-bearing for the published install instructions, so both are asserted here.
    name: npm package installs into stock openclaw
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          # Not "22": the openclaw CLI installed below refuses to install on it.
          node-version: ${{ env.OPENCLAW_NODE_VERSION }}

      - name: Resolve the openclaw version
        id: resolve
        run: |
          set -euo pipefail
          # The Dockerfile pin is the single source of truth, so the plugin is proven
          # against the same CLI the shipped image runs.
          version="$(scripts/openclaw-pin.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Installing against openclaw@${version}"

      - name: Cache the global openclaw install
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          # Shared with the schema gate, which runs in parallel: on a cold key both
          # download and both try to save it (one loses the race, harmlessly). On a
          # warm key — the common case, since the pin moves rarely — neither pays.
          # Sharing is only safe while both jobs run the same Node, hence the Node major
          # in the key: openclaw ships native modules, and a wrong-ABI restore would
          # surface as a load failure far from its cause.
          key: openclaw-${{ runner.os }}-node${{ env.OPENCLAW_NODE_VERSION }}-${{ steps.resolve.outputs.version }}

      - name: Install openclaw@${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [[ "${{ steps.cache.outputs.cache-hit }}" != "true" ]]; then
            npm install -g "openclaw@${{ steps.resolve.outputs.version }}"
          fi

      - name: Does this ref have the packaging script?
        id: packaging
        # A workflow_dispatch republish of an older release tag checks out that tag,
        # and every tag cut before the npm packaging merged has no scripts/
        # pack-memory-plugin.sh. Without this the job died on `No such file or
        # directory` with exit 127 and no indication of why. There is no packaging on
        # such a ref, so there is nothing here to verify — say so and skip.
        run: |
          set -euo pipefail
          if [[ -x scripts/pack-memory-plugin.sh ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} predates scripts/pack-memory-plugin.sh, so there is no npm packaging on this ref to check. Skipping."
          fi

      - name: Pack the plugin
        if: steps.packaging.outputs.present == 'true'
        id: pack
        run: |
          set -euo pipefail
          tarball="$(scripts/pack-memory-plugin.sh --pack --version 2026.1.1 --out "${RUNNER_TEMP}/pack")"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "Packed ${tarball}"
          tar -tzf "${tarball}"

      - name: Install the tarball into a throwaway openclaw home
        if: steps.packaging.outputs.present == 'true'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          # A dedicated HOME, because OPENCLAW_DATA_DIR does NOT isolate the CLI's
          # config — `openclaw plugins install` writes to the real ~/.openclaw
          # regardless of it. HOME is the isolation that works.
          export HOME="${RUNNER_TEMP}/openclaw-home"
          mkdir -p "${HOME}/.openclaw"
          openclaw plugins install "npm-pack:${TARBALL}" --force --accept-capabilities

          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const cfgPath = path.join(process.env.HOME, ".openclaw", "openclaw.json");
          const cfg = JSON.parse(fs.readFileSync(cfgPath, "utf8"));
          const entry = cfg.plugins?.entries?.companionintelligence;
          if (!entry?.enabled) {
            console.error("plugin did not register under the manifest id 'companionintelligence'");
            console.error(JSON.stringify(cfg, null, 2));
            process.exit(1);
          }
          console.log("registered under the manifest id, enabled");
          // OpenClaw 2026.9.1+ auto-selects kind:memory plugins into plugins.slots.memory
          // on install. Assert that so the README stays truthful if upstream reverts.
          const slot = cfg.plugins?.slots?.memory;
          console.log(`memory slot after install: ${slot ?? "(unset)"}`);
          if (slot !== "companionintelligence") {
            console.error(
              `expected plugins.slots.memory=companionintelligence after install, got ${slot ?? "(unset)"}`,
            );
            process.exit(1);
          }
          NODE

      - name: Confirm the installed plugin loads
        if: steps.packaging.outputs.present == 'true'
        run: |
          set -euo pipefail
          export HOME="${RUNNER_TEMP}/openclaw-home"
          # Install already claims the memory slot on 2026.9.1+; re-pin it so the
          # inspect step still covers an explicit slots.memory selection.
          node -e '
            const fs = require("node:fs"), path = require("node:path");
            const p = path.join(process.env.HOME, ".openclaw", "openclaw.json");
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            cfg.plugins.slots = { ...(cfg.plugins.slots ?? {}), memory: "companionintelligence" };
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + "\n");
          '
          # --runtime, matching what the plugin README tells users to run. Without it
          # inspect reports registration only; --runtime actually loads the plugin
          # runtime for hooks/tools, which is the property this step claims to confirm
          # and the one a regression would break.
          openclaw plugins inspect companionintelligence --runtime --json > "${RUNNER_TEMP}/inspect.json"
          node -e '
            const doc = require(process.env.RUNNER_TEMP + "/inspect.json").plugin;
            const problems = [];
            if (doc.status !== "loaded") problems.push(`status is ${doc.status}, expected loaded`);
            if (!doc.activated) problems.push("plugin did not activate");
            if (doc.packageName !== "@companionintelligence/openclaw-memory") {
              problems.push(`packageName is ${doc.packageName}`);
            }
            if (problems.length) { console.error(problems.join("\n")); process.exit(1); }
            console.log(`loaded ${doc.packageName} as ${doc.id} (${doc.activationReason})`);
          '

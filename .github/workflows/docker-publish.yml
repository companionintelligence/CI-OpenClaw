name: Docker Build and Push
# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   # Release tags only. This was `"*"`, which meant the runbook's own
#   # "push a test tag to verify" recipe published a real image and moved
#   # :latest onto it.
#   #
#   # Narrowed further to three segments, matching npm-publish.yml so a release tag
#   # means the same thing to both. The earlier `[0-9]*` also matched `1-scratch`,
#   # which would start a full CI gate (this workflow calls ci.yml) before anything
#   # rejected it. Checked against all 22 tags this repo has ever had: every one is
#   # YYYY.M.D and matches, so nothing that ever released is excluded. The trailing
#   # `*` absorbs a same-day `.N` suffix.
#   #
#   # Still a coarse filter, not validation — a glob is not a regex, so `1-scratch.0.0`
#   # gets through. It only limits how much machinery a junk tag can start.
#   push:
#     tags:
#       - "[0-9]*.[0-9]*.[0-9]*"
#   workflow_dispatch:
#     inputs:
#       tag:
#         description: "Existing release tag to (re)publish (for example 2026.6.1)"
#         required: true
#         type: string
#       dry_run:
#         description: "Build without pushing to GHCR or touching the Release"
#         required: false
#         default: false
#         type: boolean
# <<< ci-local:gated
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish (for example 2026.6.1)"
        required: true
        type: string
      dry_run:
        description: "Build without pushing to GHCR or touching the Release"
        required: false
        default: false
        type: boolean

# Keyed on the tag being published, so two releases never contend. An unkeyed
# group would be actively harmful here: a group holds only one pending entry,
# so a third release arriving would cancel the queued second one — and a
# cancelled release build leaves a tag with no image, which is exactly the
# state 2026.7.1 is in. Same-tag reruns still serialize, which is the case
# worth serializing.
#
# github.ref_name, not github.ref: the dispatch input is a bare tag name, so
# keying the push side on `refs/tags/X` would put a dispatch republish of X in a
# different group from the original push of X and let the two build the same tag
# at once.
concurrency:
  group: docker-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Gate the publish on the full suite — unit, bootstrap shell, the openclaw schema gate, and
  # the ci-hub plugin bundle integrity check — so a red suite cannot ship an image. This runs
  # the SAME workflow that gates PRs rather than a copy of its steps, so the two can never drift
  # apart.
  #
  # Both jobs resolve the same ref: the tag being published. Tested tree, built tree, and tagged
  # commit are therefore the same commit by construction. (This previously went through a
  # `workflow_run` hop and passed `workflow_run.head_sha`, which is the PR head-branch tip, not
  # the merge commit — so it tested a pre-merge tree. That is why the 2026.7.1 publish failed on
  # a file that existed on master but not on the branch, leaving a tag with no image.)
  #
  # Pass ONLY CI_HUB_READ_TOKEN down (not `secrets: inherit`) so ci.yml's plugin-integrity job can
  # read the private CI-Hub during the publish gate, while every other repo secret stays out of the
  # called workflow's scope. A called workflow gets no secrets otherwise.
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets:
      CI_HUB_READ_TOKEN: ${{ secrets.CI_HUB_READ_TOKEN }}
    with:
      # refs/tags/... rather than a bare name, matching npm-publish.yml: actions/checkout
      # resolves a bare ref as a branch before it tries a tag, so a branch shadowing a
      # tag would be tested and published while the rev-parse guard in the build job
      # still confirmed the tag exists.
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

  build:
    needs: test
    name: Build and push to GitHub Container Registry
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout the tag being published
        uses: actions/checkout@v6
        with:
          # refs/tags/... rather than a bare name — see the note on the test job.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve TAG and the openclaw pin
        shell: bash
        # INPUT_TAG comes through env rather than a ${{ }} interpolation: the
        # dispatch input is user-supplied, and interpolating it into the script
        # body would let a crafted value break out of the quoting.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Resolved here rather than as `${{ !inputs.dry_run }}` on the build
          # step. The inputs context is only defined for workflow_dispatch and
          # workflow_call, and getting this wrong on a tag push would produce a
          # green release that silently published nothing. Only an explicit
          # dry-run request suppresses the push; everything else publishes.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_DRY_RUN}" == "true" ]]; then
            echo "PUSH_IMAGE=false" >> "$GITHUB_ENV"
            echo "::notice::dry run — building without pushing to GHCR or touching the Release"
          else
            echo "PUSH_IMAGE=true" >> "$GITHUB_ENV"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
            git rev-parse -q --verify "refs/tags/${tag}" >/dev/null \
              || { echo "::error::tag ${tag} does not exist"; exit 1; }
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "TAG=${tag}" >> "$GITHUB_ENV"

          if [[ -x scripts/openclaw-pin.sh ]]; then
            pin="$(scripts/openclaw-pin.sh)"
          else
            # Compatibility: release tags cut before scripts/openclaw-pin.sh
            # existed can still be rebuilt via workflow_dispatch. This workflow
            # comes from the caller's ref, but the checkout is the old tree.
            # `|| true` for the same reason as the newest-tag fallback below:
            # grep exiting 1 on no match trips pipefail and would kill the step
            # with no explanation. An empty pin is caught right after.
            pin="$(grep -oE 'openclaw@[0-9][^[:space:]]*' Dockerfile | head -n1 | cut -d'@' -f2 || true)"
          fi
          [[ -n "${pin}" ]] || { echo "::error::could not read the openclaw@ pin from the Dockerfile"; exit 1; }
          echo "OPENCLAW_VERSION=${pin}" >> "$GITHUB_ENV"

          # Not github.sha: on workflow_dispatch that is the ref the run was
          # started from (usually master), not the tag being built, so the
          # image would claim a revision it was not built from.
          echo "BUILD_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set image name
        shell: bash
        run: |
          set -euo pipefail
          image='${{ vars.IMAGE_NAME }}'
          if [[ -z "${image}" ]]; then
            image='ghcr.io/${{ github.repository }}'
          fi
          echo "IMAGE_NAME=${image,,}" >> "$GITHUB_ENV"

      # :latest tracks the newest release only. Without this, a workflow_dispatch
      # republish of an older tag silently repoints :latest at it.
      - name: Compose image refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail

          if [[ -x scripts/newest-release-tag.sh ]]; then
            newest="$(scripts/newest-release-tag.sh)"
          else
            # Compatibility: release tags cut before scripts/newest-release-tag.sh
            # existed can still be rebuilt via workflow_dispatch. This workflow
            # comes from the caller's ref, but the checkout is the old tree.
            newest="$(git tag --list --sort=-v:refname \
                      | grep -E '^[0-9]{4}\.[1-9][0-9]?\.[1-9][0-9]?(\.[0-9]+)?$' | head -n1 || true)"
          fi

          {
            echo 'tags<<EOF'
            echo "${IMAGE_NAME}:${TAG}"
            if [[ -n "${newest}" && "${TAG}" == "${newest}" ]]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

          if [[ -z "${newest}" ]]; then
            # Reachable: the push glob is coarser than the release-tag regex in
            # scripts/newest-release-tag.sh — a glob is not a regex, so `1-scratch.0.0`
            # and the zero-padded `2026.08.01` both clear it. Publish the tag, but never
            # let a non-release claim :latest.
            echo "::notice::no tag matching YYYY.M.D[.N] exists — publishing ${TAG} without :latest"
          elif [[ "${TAG}" == "${newest}" ]]; then
            echo "${TAG} is the newest release tag — :latest will point at it"
          else
            echo "::notice::${TAG} is not the newest release tag (newest: ${newest}) — leaving :latest alone"
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Advisory only — a missing secret must never fail the publish. Without it
      # the build arg below expands to empty, the Dockerfile ARG default wins,
      # and we ship the same DSN-less image we always did.
      - name: Check Sentry DSN availability
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "${SENTRY_DSN}" ]; then
            echo "::notice::SENTRY_DSN secret is not set — publishing an image with no DSN compiled in. Error reporting stays inert (disabledReason: no-dsn)."
          else
            echo "SENTRY_DSN is set — baking it into ${IMAGE_NAME}:${TAG}."
          fi

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.refs.outputs.tags }}
          # telemetry.cjs reads SENTRY_DSN from the container env at start-up,
          # but nothing supplies one to a marketplace install — so until now
          # every published image reported nothing. Baked here and re-exported
          # as ENV by the Dockerfile. Empty when the secret is unset, which
          # resolveTelemetrySettings already treats as "no-dsn".
          build-args: |
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_RELEASE=ci-openclaw-server@${{ env.TAG }}
          # The bundled openclaw version rides along as a label rather than in
          # the tag name, so a running container is self-describing without
          # overloading the release-tag namespace.
          labels: |
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ env.BUILD_REVISION }}
            io.companionintelligence.openclaw.version=${{ env.OPENCLAW_VERSION }}
          provenance: false
          # Registry cache, not type=gha. Actions cache entries are ref-scoped —
          # a run restores only from its own ref plus the default branch — and
          # this workflow only ever runs on refs/tags/*, so the cache written by
          # one release tag is unreadable by the next. Every build would miss
          # while mode=max wrote multi-GB entries into the repo's shared 10GB
          # Actions cache quota, evicting the actions/cache entry ci.yml depends
          # on. A registry cache has no ref scoping, so releases actually reuse
          # each other's layers. The GHCR login above covers both directions.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          # Read-only on a dry run: a dry run must not write to the registry.
          cache-to: ${{ env.PUSH_IMAGE == 'true' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE_NAME) || '' }}

      - name: Create or update GitHub Release
        if: env.PUSH_IMAGE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          # No append_body: this workflow is re-runnable and workflow_dispatch can
          # republish an existing tag, and appending would stack a duplicate
          # "Bundled OpenClaw" line on the release every time. Replacing the body
          # keeps a republish idempotent.
          body: |
            Bundled OpenClaw: `${{ env.OPENCLAW_VERSION }}`
          draft: false
          prerelease: false
